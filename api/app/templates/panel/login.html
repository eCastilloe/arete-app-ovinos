{% extends 'base.html' %}{% block title %}Entrar · Arete{% endblock %}
{% block content %}<section class="login"><div class="marca"><span class="arete rosa">79</span><span class="arete azul">312</span><strong>Arete</strong></div><p class="sub">Panel de la Asociación</p><h1>Entrar</h1>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
