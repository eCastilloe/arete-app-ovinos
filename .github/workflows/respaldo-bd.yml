name: Respaldo semanal de la BD

on:
  schedule:
    - cron: "17 9 * * 0"   # domingos 9:17 UTC = 3:17 a. m. en Ciudad de México
  workflow_dispatch:        # botón para correrlo a mano
  push:
    branches: [feature/HU-06-respaldo] 

permissions:
  contents: read

concurrency:
  group: respaldo-bd
  cancel-in-progress: false

jobs:
  respaldo:
    name: pg_dump cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17   # debe coincidir con la versión de Neon; si Neon sube de versión, cambiar aquí
    steps:
      - name: Revisar que existan los secretos
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          faltan=0
          [ -z "$DATABASE_URL" ] && echo "::error::Falta el secreto NEON_BACKUP_URL" && faltan=1
          [ -z "$PASSPHRASE" ] && echo "::error::Falta el secreto BACKUP_PASSPHRASE" && faltan=1
          case "$DATABASE_URL" in *-pooler*) echo "::error::NEON_BACKUP_URL usa el pooler; usa la conexión directa" && faltan=1;; esac
          case "$DATABASE_URL" in *://arete_api:*|*://arete_api@*) echo "::error::NEON_BACKUP_URL usa arete_api; el RLS dejaría el respaldo vacío. Usa el rol dueño" && faltan=1;; esac
          exit $faltan

      - name: Nombre del archivo
        run: echo "ARCHIVO=arete_$(TZ=America/Mexico_City date +%Y-%m-%d_%H%M).dump" >> "$GITHUB_ENV"

      - name: pg_dump dentro del contenedor
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_URL }}
        run: |
          docker run --rm -e DATABASE_URL -v "$PWD:/out" "$PG_IMAGE" \
            pg_dump "$DATABASE_URL" --format=custom --file="/out/$ARCHIVO"

      - name: Verificar que el respaldo se puede leer
        run: |
          docker run --rm -v "$PWD:/out" "$PG_IMAGE" \
            pg_restore --list "/out/$ARCHIVO" > contenido.txt
          tablas=$(grep -c 'TABLE DATA' contenido.txt)
          echo "Tablas en el respaldo: $tablas"
          test "$tablas" -ge 30

          # raza nunca está vacía: la migración inicial siembra las razas.
          razas=$(docker run --rm -v "$PWD:/out" "$PG_IMAGE" \
            pg_restore --data-only --table=raza --file=- "/out/$ARCHIVO" \
            | awk '/^COPY /{inside=1; next} /^\\\.$/{inside=0} inside' | wc -l)
          echo "Filas en raza: $razas"
          test "$razas" -ge 1

      - name: Cifrar con AES-256
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$ARCHIVO.gpg" "$ARCHIVO"
          rm -f "$ARCHIVO" contenido.txt

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: respaldo-${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}.gpg
          retention-days: 90
          if-no-files-found: error